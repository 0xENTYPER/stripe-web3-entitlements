<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
  <title id="t">Stripe to wallet entitlement flow</title><desc id="d">A signed Stripe event passes replay and ordering checks before changing wallet feature access.</desc>
  <rect width="1200" height="520" fill="#0f1220"/><text x="60" y="66" fill="#fff" font-family="Inter,Arial" font-size="34" font-weight="800">PAYMENT SUCCESS IS NOT AUTHORIZATION.</text><text x="60" y="104" fill="#a2a8bd" font-family="Inter,Arial" font-size="18">Only a verified, durable and current server event changes wallet access.</text>
  <rect x="60" y="158" width="214" height="190" rx="8" fill="#171b2c" stroke="#3d4561"/><text x="82" y="192" fill="#8b7cff" font-family="monospace" font-size="13" font-weight="700">STRIPE EVENT</text><text x="82" y="234" fill="#fff" font-family="Inter,Arial" font-size="21" font-weight="700">subscription.updated</text><text x="82" y="272" fill="#a2a8bd" font-family="monospace" font-size="13">evt_... · cus_...</text><text x="82" y="304" fill="#a2a8bd" font-family="monospace" font-size="13">raw body + signature</text>
