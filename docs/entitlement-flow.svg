  <rect x="330" y="138" width="250" height="230" rx="8" fill="#171b2c" stroke="#8b7cff"/><text x="352" y="174" fill="#8b7cff" font-family="monospace" font-size="13" font-weight="700">SECURITY GATE</text><text x="352" y="216" fill="#fff" font-family="Inter,Arial" font-size="17" font-weight="700">✓ HMAC + raw body</text><text x="352" y="252" fill="#fff" font-family="Inter,Arial" font-size="17" font-weight="700">✓ timestamp tolerance</text><text x="352" y="288" fill="#fff" font-family="Inter,Arial" font-size="17" font-weight="700">✓ unique event ID</text><text x="352" y="324" fill="#fff" font-family="Inter,Arial" font-size="17" font-weight="700">✓ event ordering</text>
