  <rect x="636" y="138" width="236" height="230" rx="8" fill="#171b2c" stroke="#3d4561"/><text x="658" y="174" fill="#8b7cff" font-family="monospace" font-size="13" font-weight="700">POLICY REDUCER</text><rect x="658" y="202" width="190" height="38" rx="5" fill="#18362b"/><text x="674" y="226" fill="#67e0ae" font-family="monospace" font-size="13">ACTIVE · FEATURES</text><rect x="658" y="252" width="190" height="38" rx="5" fill="#3a321f"/><text x="674" y="276" fill="#f7c56d" font-family="monospace" font-size="13">PAST_DUE · GRACE</text><rect x="658" y="302" width="190" height="38" rx="5" fill="#4a2630"/><text x="674" y="326" fill="#ff8098" font-family="monospace" font-size="13">CANCELED · REVOKED</text>
